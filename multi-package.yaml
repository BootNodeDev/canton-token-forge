# Multi-package workspace. daml/ is a CONTAINER of packages (mirroring the
# upstream canton-network/splice daml/ layout), not a package itself. Each
# subfolder is its own dpm package:
#
#   daml/canton-token-forge/       production templates              (name: canton-token-forge)
#   daml/canton-token-forge-test/  integration-test package          (name: canton-token-forge-test)
#
# The test package data-depends on the compiled canton-token-forge DAR. Build each
# package in its own dpm invocation (see package.json) - never `dpm build --all`,
# and never `dpm build` at this root (it is not a package).
packages:
  - ./daml/canton-token-forge
  - ./daml/canton-token-forge-test
