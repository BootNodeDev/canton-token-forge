# PR self-assign - house precedent from dAppBooster (issue #11).
#
# Assigns the author to their own PR on open so the board always has an owner.
# Convenience, not a gate: kept out of pr.yml so that workflow stays read-only.
# Uses the built-in GITHUB_TOKEN + gh CLI - no third-party action, no app install.
name: pr-assign

on:
  pull_request:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  assign-author:
    name: assign author
    runs-on: ubuntu-latest
    # Skip fork PRs (their token is read-only, so the assign would error, not
    # no-op) and bot authors (Renovate, etc.).
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && !endsWith(github.event.pull_request.user.login, '[bot]') }}
    steps:
      - name: Assign the author
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: gh pr edit "$PR_URL" --add-assignee "$AUTHOR"
