# Stands in for a downstream repository that received only the release asset.
# The DAR is copied into vendor/ by scripts/consumer-smoke.sh rather than
# referenced in the build tree, because a consumer has no build tree of ours to
# point at.
sdk-version: 3.4.11
name: consumer-smoke
source: daml
version: 0.0.1
dependencies:
  - daml-prim
  - daml-stdlib
data-dependencies:
  - vendor/canton-token-forge.dar
build-options:
  - --target=2.1
  # The DAR bundles these six packages but damlc hides them: importing
  # Splice.Api.Token.* without these lines fails with "member of the hidden
  # package". The compiler suggests ':set -package', which is a GHCi command
  # and not the fix. These exact lines are what the release body publishes,
  # extracted from this file by scripts/release-notes.sh.
  - --package=splice-api-token-holding-v1-1.0.0
  - --package=splice-api-token-metadata-v1-1.0.0
  - --package=splice-api-token-transfer-instruction-v1-1.0.0
  - --package=splice-api-token-allocation-v1-1.0.0
  - --package=splice-api-token-allocation-instruction-v1-1.0.0
  - --package=splice-api-token-burn-mint-v1-1.0.0
